# デモで聞く3問と、正解
demo_questions:
  - q: アプリの名前、結局どうなった？
    expect: 現在は「Margin」（d7）。最初は仮の名前「Bookmark」（d1）で、公開前に変更した
  - q: 収益化の方針は変わった？なぜ？
    expect: 無料＋広告（d2）→ 買い切り480円（d8）。理由は広告SDKの審査・運用が重いから
  - q: AIを乗り換えたせいで、前の決定をひっくり返したことはある？
    expect: 2件。アプリ名（Chip GPT→Gemmy、d1→d7）と収益化（Chip GPT→Crowd、d2→d8）
